name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2 "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # eval/results holds generated reports whose model outputs contain
          # example URLs (api.example.com, placeholders) — not documentation, so
          # excluded here just as they are from markdownlint. Publishers that
          # block automated checkers are in .lycheeignore. Genuine 404/410/DNS
          # failures still fail the build; retry smooths transient timeouts.
          args: --no-progress --include-fragments --exclude-path eval/results --max-retries 2 --retry-wait-time 3 './**/*.md'

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-parity.sh
