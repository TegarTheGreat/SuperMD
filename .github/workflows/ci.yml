name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2 "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Links inside fenced code blocks (example API endpoints, placeholders)
          # are skipped by lychee. Publishers that block automated checkers are
          # listed in .lycheeignore (read automatically). Genuine 404/410/DNS
          # failures still fail the build. Retry smooths over transient timeouts.
          args: --no-progress --include-fragments --max-retries 2 --retry-wait-time 3 './**/*.md'

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-parity.sh
