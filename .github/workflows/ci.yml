name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2 "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Explicit input set: every docs tree EXCEPT eval/results, whose
          # generated reports contain model-output example URLs (api.example.com,
          # placeholders) that are not real links — the same reason it is ignored
          # by markdownlint. Publishers that block automated checkers are in
          # .lycheeignore. Genuine 404/410/DNS failures still fail the build.
          args: --no-progress --include-fragments --max-retries 2 --retry-wait-time 3 './*.md' './.github/**/*.md' './docs/**/*.md' './en/**/*.md' './id/**/*.md' './eval/README.md'

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-parity.sh
