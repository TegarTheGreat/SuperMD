name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2 "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Accept anti-bot / rate-limit codes (403, 429): several publishers
          # (e.g. science.org) block automated checkers while the links are
          # valid for humans. Genuinely broken links (404, 410, DNS failure)
          # still fail the build. Retry to smooth over transient timeouts.
          args: --no-progress --include-fragments --accept '200..=299,403,429' --max-retries 2 --retry-wait-time 3 './**/*.md'
          fail: true

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-parity.sh
