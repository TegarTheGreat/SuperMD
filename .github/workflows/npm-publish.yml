name: Publish packages

# Publishes when a version tag (v*) is pushed:
#   - `supermd` to the npm registry (canonical). Authentication, in order:
#       1. the NPM_TOKEN repository secret, if set (an npm Automation or
#          granular token; read only from the secret, never in the repo);
#       2. otherwise npm trusted publishing (OIDC): no secret at all, after a
#          one-time setup on npmjs.com (package Settings -> Trusted Publisher:
#          owner TegarTheGreat, repository SuperMD, workflow npm-publish.yml).
#   - `@tegarthegreat/supermd` to GitHub Packages (a mirror so the package
#     shows in the repo sidebar; uses the workflow's own GITHUB_TOKEN)
#   - a GitHub Release whose notes are this version's CHANGELOG section
# The jobs are independent: one failing does not block the others.
# v1.10.0 and v1.11.0 never reached npm: both runs failed with ENEEDAUTH
# because neither authentication path above was configured.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships an npm new enough for trusted publishing (OIDC).
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Run the full suite from the checked-out tag before publishing anything.
      - run: npm test

      # The tag must match the version in package.json, or we would publish the
      # wrong thing. Fail loudly on a mismatch.
      - name: Check tag matches package.json
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      # Publishing an existing version errors; skip cleanly if it is already up.
      - name: Skip if version already published
        id: check
        run: |
          if npm view "supermd@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "supermd@${{ steps.ver.outputs.version }} is already on npm — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with NPM_TOKEN
        if: steps.check.outputs.already == 'false' && env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with npm trusted publishing (OIDC)
        if: steps.check.outputs.already == 'false' && env.NPM_TOKEN == ''
        run: |
          echo "::notice::No NPM_TOKEN secret, so publishing through npm trusted publishing (OIDC). If this fails with ENEEDAUTH, either add the NPM_TOKEN secret or configure a trusted publisher on npmjs.com for TegarTheGreat/SuperMD, workflow npm-publish.yml. See CONTRIBUTING.md."
          npm publish --access public

  publish-github-packages:
    # GitHub Packages only accepts owner-scoped names, so this publishes the
    # mirror `@tegarthegreat/supermd`. The canonical install stays
    # `npx supermd` from npm.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - run: npm test

      - name: Check tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Scope the package name for GitHub Packages
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@tegarthegreat/supermd';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Skip if version already published
        id: ghcheck
        run: |
          if npm view "@tegarthegreat/supermd@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@tegarthegreat/supermd@${GITHUB_REF_NAME#v} is already on GitHub Packages — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.ghcheck.outputs.already == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    # Creates the GitHub Release for the tag, with this version's CHANGELOG
    # section as the notes. Independent of the package jobs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to do."
            exit 0
          fi
          awk -v v="$VERSION" '/^## \[/{ if (found) exit; if (index($0, "## [" v "]") == 1) { found=1; next } } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "SuperMD $VERSION" --notes-file notes.md
