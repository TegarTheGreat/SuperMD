name: Publish packages

# Publishes the package when a version tag (v*) is pushed:
#   - `supermd` to the npm registry (canonical; requires the NPM_TOKEN secret,
#     an npm Automation token — read only from the secret, never in the repo)
#   - `@tegarthegreat/supermd` to GitHub Packages (a mirror so the package
#     shows in the repo sidebar; uses the workflow's own GITHUB_TOKEN)
# The two jobs are independent: one failing does not block the other.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Run the full suite from the checked-out tag before publishing anything.
      - run: npm test

      # The tag must match the version in package.json, or we would publish the
      # wrong thing. Fail loudly on a mismatch.
      - name: Check tag matches package.json
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      # Publishing an existing version errors; skip cleanly if it is already up.
      - name: Skip if version already published
        id: check
        run: |
          if npm view "supermd@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "supermd@${{ steps.ver.outputs.version }} is already on npm — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    # GitHub Packages only accepts owner-scoped names, so this publishes the
    # mirror `@tegarthegreat/supermd`. The canonical install stays
    # `npx supermd` from npm.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - run: npm test

      - name: Check tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Scope the package name for GitHub Packages
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@tegarthegreat/supermd';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Skip if version already published
        id: ghcheck
        run: |
          if npm view "@tegarthegreat/supermd@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@tegarthegreat/supermd@${GITHUB_REF_NAME#v} is already on GitHub Packages — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.ghcheck.outputs.already == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
